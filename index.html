<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>랜덤 로또 번호 추첨기</title>
    <style>
        /* 페이지 전체 스타일 */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f2f5;
            font-family: 'Pretendard', sans-serif;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }


        /* 전체 컨테이너 */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px; /* 요소 사이의 간격 */
            background-color: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }
        
        h1 {
            margin: 0;
            font-size: 28px;
            color: #333;
        }


        /* 이름 입력창과 버튼을 묶는 영역 */
        .input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 15px;
        }


        /* 이름 입력창 스타일 */
        #name-input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            text-align: center;
        }


        /* 추첨하기 버튼 스타일 */
        #draw-button {
            width: 100%;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background: linear-gradient(45deg, #007bff, #0056b3);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s ease;
        }
        
        #draw-button:active {
            transform: scale(0.98);
        }


        /* 번호가 표시될 영역 스타일 */
        #lotto-numbers {
            display: flex;
            gap: 10px;
            flex-wrap: wrap; /* 화면이 작아지면 줄바꿈 */
            justify-content: center;
            height: 50px; /* 초기 높이 지정 */
        }
        
        /* 각 번호 공 스타일 */
        .lotto-ball {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            color: white;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }


        /* 결과 메시지 스타일 */
        #result-message {
            font-size: 20px;
            color: #333;
            font-weight: 500;
            text-align: center;
            height: 30px; /* 초기 높이 지정 */
        }
        
        #winner-name {
            font-weight: bold;
            color: #0056b3;
        }


    </style>
</head>
<body>


    <div class="container">
        <h1>🍀 행운의 로또 번호</h1>
        
        <div class="input-group">
            <input type="text" id="name-input" placeholder="이름을 입력하세요">
            <button id="draw-button">번호 추첨하기</button>
        </div>


        <div id="lotto-numbers"></div>
        <p id="result-message"></p>
    </div>


    <script>
        // JavaScript 코드
        document.getElementById('draw-button').addEventListener('click', function() {
            const name = document.getElementById('name-input').value;


            // 이름이 입력되지 않았으면 경고하고 함수 종료
            if (name.trim() === '') {
                alert('이름을 입력해주세요!');
                return;
            }


            // 1. 6개의 랜덤 번호 생성
            const lottoNumbers = new Set(); // 중복을 허용하지 않는 Set 자료구조 사용
            while (lottoNumbers.size < 6) {
                const randomNumber = Math.floor(Math.random() * 45) + 1;
                lottoNumbers.add(randomNumber);
            }


            // Set을 배열로 변환하고 오름차순으로 정렬
            const sortedNumbers = Array.from(lottoNumbers).sort((a, b) => a - b);


            // 2. 화면에 번호 표시하기
            const numbersDiv = document.getElementById('lotto-numbers');
            numbersDiv.innerHTML = ''; // 기존 번호 지우기


            sortedNumbers.forEach(number => {
                const ball = document.createElement('div');
                ball.className = 'lotto-ball';
                ball.textContent = number;
                ball.style.backgroundColor = getBallColor(number);
                numbersDiv.appendChild(ball);
            });


            // 3. 결과 메시지 표시하기
            const resultP = document.getElementById('result-message');
            resultP.innerHTML = `제 1140회 로또 행운의 주인공은 <span id="winner-name">${name}</span>님!`;
        });


        // 로또 번호에 따라 공 색상을 결정하는 함수
        function getBallColor(number) {
            if (number <= 10) return '#fbc400'; // 노란색
            if (number <= 20) return '#69c8f2'; // 파란색
            if (number <= 30) return '#ff7272'; // 빨간색
            if (number <= 40) return '#aaa';    // 회색
            return '#b0d840';                   // 녹색
        }
    </script>
</body>
</html>
